[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "options-alpha-agent"
version = "0.1.0"
description = "Risk-gated autonomous options paper-trading agent for the Alpaca AI Trading Agents Hackathon"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "MIT" }
authors = [{ name = "jaeyooniee" }]
dependencies = [
  "alpaca-py>=0.42,<1",
  "openai>=1.100,<2",
  "python-dotenv>=1.1,<2",
  "google-cloud-storage>=3.0,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[project.scripts]
options-alpha = "options_alpha_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
