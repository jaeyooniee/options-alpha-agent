<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Options Alpha: The Guarded Agent</title>
  <desc id="desc">A 16 by 9 cover showing an options AI research layer behind explicit paper-trading risk gates.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071425"/>
      <stop offset="1" stop-color="#123257"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#66e3c4"/>
      <stop offset="1" stop-color="#67b7ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1370" cy="100" r="360" fill="#67b7ff" opacity=".08"/>
  <circle cx="1510" cy="790" r="330" fill="#66e3c4" opacity=".07"/>
  <path d="M0 680 C280 560 390 800 650 650 S1120 430 1600 590" fill="none" stroke="#67b7ff" stroke-width="2" opacity=".2"/>
  <path d="M0 720 C300 600 420 820 700 690 S1180 480 1600 630" fill="none" stroke="#66e3c4" stroke-width="2" opacity=".16"/>

  <g transform="translate(110 112)">
    <text x="0" y="0" fill="#66e3c4" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="6">ALPACA AI TRADING AGENTS HACKATHON</text>
    <text x="0" y="165" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="86" font-weight="700">OPTIONS ALPHA</text>
    <rect x="4" y="205" width="510" height="8" rx="4" fill="url(#accent)"/>
    <text x="0" y="292" fill="#d7e8ff" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="600">THE GUARDED AGENT</text>
    <text x="2" y="365" fill="#9db8d7" font-family="Arial, Helvetica, sans-serif" font-size="27">Autonomous options research, bounded risk, paper-only execution.</text>
  </g>

  <g transform="translate(930 160)" filter="url(#shadow)">
    <rect width="510" height="560" rx="30" fill="#0d2038" stroke="#2d547d" stroke-width="3"/>
    <text x="42" y="58" fill="#9db8d7" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="3">DECISION PATH</text>
    <g transform="translate(42 90)">
      <rect width="426" height="74" rx="16" fill="#173656" stroke="#2c6792"/>
      <text x="24" y="31" fill="#67b7ff" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">01  EVIDENCE</text>
      <text x="24" y="57" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="22">Alpaca option quotes + Greeks</text>
    </g>
    <path d="M255 176 v30" stroke="#66e3c4" stroke-width="3"/>
    <g transform="translate(42 222)">
      <rect width="426" height="74" rx="16" fill="#173656" stroke="#2c6792"/>
      <text x="24" y="31" fill="#66e3c4" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">02  REASON</text>
      <text x="24" y="57" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="22">Strict JSON, no hidden authority</text>
    </g>
    <path d="M255 308 v30" stroke="#66e3c4" stroke-width="3"/>
    <g transform="translate(42 354)">
      <rect width="426" height="74" rx="16" fill="#173656" stroke="#2c6792"/>
      <text x="24" y="31" fill="#fcd34d" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">03  GATE</text>
      <text x="24" y="57" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="22">DTE · spread · loss · drawdown</text>
    </g>
    <path d="M255 440 v30" stroke="#66e3c4" stroke-width="3"/>
    <g transform="translate(42 486)">
      <rect width="426" height="50" rx="16" fill="#143526" stroke="#46b995"/>
      <text x="24" y="33" fill="#9bf2d7" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">PAPER ONLY · ORDER SENT: NO</text>
    </g>
  </g>

  <text x="110" y="818" fill="#8ca9c8" font-family="Arial, Helvetica, sans-serif" font-size="22">OPTIONS-ONLY  /  DEFINED-RISK  /  AUDITABLE</text>
  <text x="1490" y="818" fill="#8ca9c8" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="end">SOLO BUILD · 2026</text>
</svg>
