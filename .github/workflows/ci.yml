name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff format --check .
      - run: python -m ruff check .
      - run: python -m pytest --cov=options_alpha_agent --cov-report=term-missing
      - name: Validate submission artifacts and secret scan
        run: python -m options_alpha_agent.cli submission-check
      - name: Build worker image
        run: docker build --file Dockerfile.worker --tag options-alpha-worker:ci .
      - name: Smoke-test worker image without credentials or network
        run: docker run --rm options-alpha-worker:ci options-alpha demo
      - name: Build dashboard image
        run: docker build --file Dockerfile.dashboard --tag options-alpha-dashboard:ci .
      - name: Smoke-test dashboard health and judge overview
        run: |
          docker run --detach --rm --name options-alpha-dashboard-ci --publish 8080:8080 options-alpha-dashboard:ci
          trap 'docker logs options-alpha-dashboard-ci || true; docker stop options-alpha-dashboard-ci || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:8080/api/healthz >/tmp/health.json; then
              break
            fi
            sleep 1
          done
          test -s /tmp/health.json
          curl --fail --silent --show-error http://127.0.0.1:8080/demo >/tmp/demo.html
          python -c "from pathlib import Path; assert b'AI proposes.' in Path('/tmp/demo.html').read_bytes()"
